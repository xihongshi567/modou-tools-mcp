[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modou-tools-mcp"
version = "0.1.0"
description = "全球技术情报采集 MCP：GitHub/arXiv/Exa/HN/掘金/知乎/B站/A股 一站式零 key 采集"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "he-xihongshi" }]
keywords = ["mcp", "agent", "github", "arxiv", "exa", "juejin", "stock", "情报采集"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=2.0",
    "requests>=2.31",
    "trafilatura>=1.8",
    "pymupdf>=1.24",
    "akshare>=1.14",
]

[project.urls]
Homepage = "https://github.com/he-xihongshi/modou-tools-mcp"
Repository = "https://github.com/he-xihongshi/modou-tools-mcp"

[project.scripts]
modou-tools-mcp = "modou_tools_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modou_tools_mcp = ["py.typed"]
